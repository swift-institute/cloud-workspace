# Throwaway probe on a session branch (swift-institute/.github#660): does
# swift test stream its output when run under a pty, and does the pty
# wrapper keep swift test's exit status? Not for main.
name: stream-probe
on:
  push:
    branches: [coenttb/charming-volta-ftybc4]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Write probe package
        shell: bash
        run: |
          mkdir -p probe/Sources/P probe/Tests/PTests
          cd probe
          printf '%s\n' '// swift-tools-version: 6.0' 'import PackageDescription' \
            'let package = Package(name: "P", targets: [.target(name: "P"), .testTarget(name: "PTests", dependencies: ["P"])])' > Package.swift
          echo 'public let p = 1' > Sources/P/P.swift
          cat > Tests/PTests/T.swift <<'SWIFT'
          import Testing
          import Foundation
          @Suite(.serialized) struct Slow {
            @Test func a() { Thread.sleep(forTimeInterval: 10) }
            @Test func b() { Thread.sleep(forTimeInterval: 10) }
            @Test func c() { Thread.sleep(forTimeInterval: 10) }
            @Test func fails() { #expect(ProcessInfo.processInfo.environment["PROBE_FAIL"] == nil) }
          }
          SWIFT
          swift --version
          swift build --build-tests
      - name: Plain (as swift-ci.yml runs it today)
        shell: bash
        working-directory: probe
        run: swift test
      - name: macOS under a pty
        if: runner.os == 'macOS'
        shell: bash
        working-directory: probe
        run: |
          TERM=dumb NO_COLOR=1 script -q /dev/null swift test < /dev/null || echo "pass case rc=$?"
          echo "pass case done"
          PROBE_FAIL=1 TERM=dumb NO_COLOR=1 script -q /dev/null swift test --filter fails < /dev/null || echo "fail case rc=$?"
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - name: Write probe package
        shell: bash
        run: |
          mkdir -p probe/Sources/P probe/Tests/PTests
          cd probe
          printf '%s\n' '// swift-tools-version: 6.0' 'import PackageDescription' \
            'let package = Package(name: "P", targets: [.target(name: "P"), .testTarget(name: "PTests", dependencies: ["P"])])' > Package.swift
          echo 'public let p = 1' > Sources/P/P.swift
          cat > Tests/PTests/T.swift <<'SWIFT'
          import Testing
          import Foundation
          @Suite(.serialized) struct Slow {
            @Test func a() { Thread.sleep(forTimeInterval: 10) }
            @Test func b() { Thread.sleep(forTimeInterval: 10) }
            @Test func c() { Thread.sleep(forTimeInterval: 10) }
            @Test func fails() { #expect(ProcessInfo.processInfo.environment["PROBE_FAIL"] == nil) }
          }
          SWIFT
          swift build --build-tests
      - name: Plain
        shell: bash
        working-directory: probe
        run: swift test
      - name: Line-buffered
        shell: bash
        working-directory: probe
        run: |
          stdbuf -oL swift test
          PROBE_FAIL=1 stdbuf -oL swift test --filter fails || echo "fail case rc=$?"
